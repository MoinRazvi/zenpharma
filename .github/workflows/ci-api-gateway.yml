
name: CI/CD — api-gateway

# Triggers on push to develop / release branches only.
# Feature branches and PRs → ci-pr-api-gateway.yml
#
# Jobs:
#   build       → Maven + SAST + Docker + ECR + Cosign
#   deploy-dev  → Update image tag in GitOps values → Argo CD auto-syncs
#
# PROD promotion → promote-prod.yml (workflow_dispatch)

on:
  push:
    branches:
      - develop
      - release/**
    paths:
      - backend/api-gateway/**
      - .github/workflows/ci-api-gateway.yml
      - .github/workflows/_java-build.yml

  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: false
        default: develop
        type: string

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: api-gateway

jobs:
  # 1. Build, test, scan, push to ECR, and sign the image
  build:
    name: Build & Security Gates (api-gateway)
    uses: ./.github/workflows/_java-build.yml
    with:
      service-name: api-gateway
      service-dir: backend/api-gateway
      ecr-repository: api-gateway
      aws-region: us-east-1
      needs-database: false
    secrets: inherit

  # 2. Update the DEV image tag in the monorepo.
  # Argo CD detects the Git change and reconciles the deployment.
  deploy-dev:
    name: Deploy api-gateway → DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag — DEV
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          set -euo pipefail

          if [ -z "${IMAGE_TAG}" ]; then
            echo "ERROR: IMAGE_TAG is empty."
            exit 1
          fi

          if ! command -v yq >/dev/null 2>&1; then
            echo "ERROR: yq is not installed."
            exit 1
          fi

          yq -i '.image.tag = strenv(IMAGE_TAG)' \
            gitops/envs/dev/values-api-gateway.yaml

          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add gitops/envs/dev/values-api-gateway.yaml

          if git diff --cached --quiet; then
            echo "Image tag is already up to date."
            exit 0
          fi

          git commit -m "ci(dev): update api-gateway to ${IMAGE_TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
